# Plantilla de GitLab CI para GoodHacker DAST (CICD-09).
#
# Uso en .gitlab-ci.yml:
#   include:
#     - remote: "<URL de esta plantilla>"   # o cópiala al repositorio y usa `local:`
#   dast:
#     extends: .ghdast-scan
#     stage: test
#     variables:
#       GHDAST_WEBAPP_ID: "12"
#       GHDAST_ARGS: "--fail-on-severity high --exclude-detection GH-DAST-0040"
#
# Variables de CI/CD (Settings → CI/CD → Variables, enmascaradas):
#   GH_DAST_API_URL, GH_DAST_CLIENT_ID, GH_DAST_CLIENT_SECRET
#
# La CLI se descarga de la propia plataforma (…/dast/api/cli/ghdast.py) y se comprueba su
# SHA-256 si se fija GHDAST_CLI_SHA256.

.ghdast-scan:
  image: python:3.12-slim
  variables:
    GHDAST_WEBAPP_ID: ""
    GHDAST_WEBAPP_NAME: ""
    GHDAST_ARGS: ""
    GHDAST_CLI_SHA256: ""
  script:
    - python3 -c "import urllib.request,os;u=os.environ['GH_DAST_API_URL'].rstrip('/').rsplit('/',1)[0]+'/cli/ghdast.py';urllib.request.urlretrieve(u,'ghdast.py')"
    - if [ -n "$GHDAST_CLI_SHA256" ]; then echo "$GHDAST_CLI_SHA256  ghdast.py" | sha256sum -c -; fi
    - |
      if [ -n "$GHDAST_WEBAPP_ID" ]; then
        python3 ghdast.py scan --webapp-id "$GHDAST_WEBAPP_ID" $GHDAST_ARGS
      else
        python3 ghdast.py scan --webapp-name "$GHDAST_WEBAPP_NAME" $GHDAST_ARGS
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ghdast-results/
