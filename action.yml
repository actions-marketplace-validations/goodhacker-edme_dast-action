name: GoodHacker DAST scan
description: Run a GoodHacker DAST scan on a registered web app or API and fail the build on your security criteria.
author: GoodHacker
branding:
  icon: shield
  color: blue

inputs:
  api-url:
    description: Base URL of the GoodHacker public API (ends in /dast/api/v1)
    required: true
  client-id:
    description: Client ID of a GoodHacker API client (recommended)
    required: false
  client-secret:
    description: Secret of the API client
    required: false
  username:
    description: Username, as an alternative to an API client (Basic authentication). Not valid with MFA.
    required: false
  password:
    description: User password
    required: false
  webapp-id:
    description: ID of the registered application
    required: false
  webapp-name:
    description: Exact name of the application (instead of the ID)
    required: false
  scan-type:
    description: vulnerability or discovery
    default: vulnerability
  profile-id:
    description: Option profile ID (default, the application's)
    required: false
  auth-record-id:
    description: Authentication record ID (default, the application's)
    required: false
  name:
    description: Scan name (default, "workflow #run date")
    required: false
  name-template:
    description: Scan name template; variables job, build, branch, commit, platform, webapp, timestamp
    required: false
  wait:
    description: Wait for the scan to finish
    default: "true"
  poll-interval:
    description: Seconds between status checks
    default: "30"
  timeout:
    description: Maximum wait in seconds
    default: "14400"
  cancel-on-timeout:
    description: Cancel the scan when the wait times out
    default: "false"
  fail-on-severity:
    description: Fail if there is any finding of this severity or higher (critical, high, medium, low, info)
    required: false
  max-count:
    description: Maximum findings per severity, e.g. "critical=0,high=5"
    required: false
  fail-on-detection:
    description: Comma-separated detection IDs that fail the build
    required: false
  exclude-detection:
    description: Comma-separated detection IDs that do not count towards any criterion
    required: false
  fail-on-scan-error:
    description: Fail if the scan does not finish or finishes without results
    default: "false"
  report:
    description: Scan report to attach (pdf or none)
    default: pdf
  output-dir:
    description: Results folder
    default: ghdast-results
  upload-artifacts:
    description: Upload the results as a workflow artifact
    default: "true"
  artifact-name:
    description: Artifact name
    default: ghdast-results

outputs:
  scan-id:
    description: Scan ID
    value: ${{ steps.scan.outputs.scan_id }}
  scan-state:
    description: Final scan state
    value: ${{ steps.scan.outputs.scan_state }}
  passed:
    description: true if the build meets the criteria
    value: ${{ steps.scan.outputs.passed }}
  result-json:
    description: Path of result.json
    value: ${{ steps.scan.outputs.result_json }}
  report-pdf:
    description: Path of the PDF report
    value: ${{ steps.scan.outputs.report_pdf }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        GH_DAST_API_URL: ${{ inputs.api-url }}
        GH_DAST_CLIENT_ID: ${{ inputs.client-id }}
        GH_DAST_CLIENT_SECRET: ${{ inputs.client-secret }}
        GH_DAST_USERNAME: ${{ inputs.username }}
        GH_DAST_PASSWORD: ${{ inputs.password }}
        IN_WEBAPP_ID: ${{ inputs.webapp-id }}
        IN_WEBAPP_NAME: ${{ inputs.webapp-name }}
        IN_SCAN_TYPE: ${{ inputs.scan-type }}
        IN_PROFILE_ID: ${{ inputs.profile-id }}
        IN_AUTH_RECORD_ID: ${{ inputs.auth-record-id }}
        IN_NAME: ${{ inputs.name }}
        IN_NAME_TEMPLATE: ${{ inputs.name-template }}
        IN_WAIT: ${{ inputs.wait }}
        IN_POLL: ${{ inputs.poll-interval }}
        IN_TIMEOUT: ${{ inputs.timeout }}
        IN_CANCEL: ${{ inputs.cancel-on-timeout }}
        IN_SEVERITY: ${{ inputs.fail-on-severity }}
        IN_MAX_COUNT: ${{ inputs.max-count }}
        IN_FAIL_DET: ${{ inputs.fail-on-detection }}
        IN_EXCL_DET: ${{ inputs.exclude-detection }}
        IN_SCAN_ERROR: ${{ inputs.fail-on-scan-error }}
        IN_REPORT: ${{ inputs.report }}
        IN_OUT: ${{ inputs.output-dir }}
      run: |
        args=(scan --scan-type "$IN_SCAN_TYPE" --poll-interval "$IN_POLL" --timeout "$IN_TIMEOUT"
              --report "$IN_REPORT" --output-dir "$IN_OUT")
        if [ -n "$IN_WEBAPP_ID" ]; then args+=(--webapp-id "$IN_WEBAPP_ID"); else args+=(--webapp-name "$IN_WEBAPP_NAME"); fi
        [ -n "$IN_PROFILE_ID" ] && args+=(--profile-id "$IN_PROFILE_ID")
        [ -n "$IN_AUTH_RECORD_ID" ] && args+=(--auth-record-id "$IN_AUTH_RECORD_ID")
        [ -n "$IN_NAME" ] && args+=(--name "$IN_NAME")
        [ -n "$IN_NAME_TEMPLATE" ] && args+=(--name-template "$IN_NAME_TEMPLATE")
        [ "$IN_WAIT" = "false" ] && args+=(--no-wait)
        [ "$IN_CANCEL" = "true" ] && args+=(--cancel-on-timeout)
        [ -n "$IN_SEVERITY" ] && args+=(--fail-on-severity "$IN_SEVERITY")
        [ -n "$IN_MAX_COUNT" ] && args+=(--max-count "$IN_MAX_COUNT")
        [ -n "$IN_FAIL_DET" ] && args+=(--fail-on-detection "$IN_FAIL_DET")
        [ -n "$IN_EXCL_DET" ] && args+=(--exclude-detection "$IN_EXCL_DET")
        [ "$IN_SCAN_ERROR" = "true" ] && args+=(--fail-on-scan-error)
        set +e
        python3 "$GITHUB_ACTION_PATH/ghdast.py" "${args[@]}"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
    - if: always() && inputs.upload-artifacts == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}
        if-no-files-found: ignore
    - shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit_code }}
      run: exit "${CODE:-3}"
